name: Feature
description: Track a SiteCare implementation issue
title: "[SC-XXX] "
labels:
  - feature
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this issue deliver?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work included in this issue.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable completion criteria.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What tests must be added or updated?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues or prerequisites.
  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Security, migration, API, or operational considerations.
